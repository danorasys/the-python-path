title: Datenstrukturen
description: In diesem Modul lernst du, wie man verschiedene Arten von Sammlungen in Python verwaltet. Du erfährst, wie man Listen, Tupel, Wörterbücher und Mengen verwendet, um Informationen zu speichern und zu organisieren, sowie wie man ihre Elemente durchläuft und manipuliert.
