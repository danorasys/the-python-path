title: Funktionen und Wiederverwendbarkeit von Code
description: In diesem Modul lernst du, wie man Funktionen erstellt und verwendet, um deinen Code zu organisieren und Wiederholungen zu vermeiden. Du erfährst, wie man Werte übergibt und zurückgibt, optionale Parameter verwendet und den Geltungsbereich von Variablen versteht. Außerdem lernst du verschachtelte Funktionen und Lambda-Ausdrücke kennen.
