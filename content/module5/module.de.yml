title: Umgang mit Text und Daten
description: In diesem Modul lernst du, wie man mit Textketten arbeitet, sie verändert und mit verschiedenen Techniken formatiert. Du erfährst auch, wie man Text in Listen umwandelt und umgekehrt, und wendest das Gelernte in kleinen praktischen Projekten wie einem Wortzähler oder einem Passwortprüfer an.
