title: Logisches Denken und erweiterte Funktionen
description: In diesem Modul entwickelst du deine Programmierlogik weiter, indem du fortgeschrittene Techniken lernst. Du erfährst, wie man rekursive Funktionen, List Comprehensions und eingebaute Python-Funktionen verwendet, um Probleme effizienter zu lösen. Außerdem lernst du, Funktionen wie Objekte zu behandeln, um flexibleren Code zu erstellen.
